<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>업로드 / 샘플 선택</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="phone-frame" aria-label="회의 데이터 업로드 또는 샘플 선택">
        <header class="status-bar">
          <span class="time">12:22</span>
          <div class="status-icons" aria-label="상태 표시">
            <span class="signal"><i></i><i></i><i></i><i></i></span>
            <span class="wifi" aria-hidden="true"></span>
            <span class="battery" aria-hidden="true"
              ><span class="battery-level"></span
            ></span>
          </div>
        </header>

        <main class="screen">
          <div class="screen-header">
            <span class="screen-tag">업로드</span>
            <h1>회의 데이터 업로드 또는 샘플 선택</h1>
          </div>
          <div class="upload-box">
            <button class="primary-btn large-btn">업로드</button>
            <button class="secondary-btn large-btn">샘플 선택</button>
          </div>
          <div class="slide-actions">
            <a
              class="slide-nav-btn secondary disabled"
              href="step-01-upload.html"
              >이전</a
            >
            <a class="slide-nav-btn primary" href="step-02-transcript.html"
              >다음</a
            >
          </div>
        </main>
      </div>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
