<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STT·화자 검토</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="phone-frame" aria-label="STT 화자 검토 화면">
        <header class="status-bar">
          <span class="time">12:22</span>
          <div class="status-icons" aria-label="상태 표시">
            <span class="signal"><i></i><i></i><i></i><i></i></span>
            <span class="wifi" aria-hidden="true"></span>
            <span class="battery" aria-hidden="true"
              ><span class="battery-level"></span
            ></span>
          </div>
        </header>

        <main class="screen">
          <div class="screen-header">
            <span class="screen-tag">STT·화자 검토</span>
            <h1>STT·화자 검토 화면</h1>
          </div>
          <div class="transcript-box">
            <div class="speaker-tag">화자 A</div>
            <p>
              이번 회의에서는 Whisper를 우선 적용하고, 정확도 비교를 이어서
              검증하기로 했습니다.
            </p>
            <div class="speaker-tag">화자 B</div>
            <p>
              지원이 구조화 Agent를 구현하고, 서경은 테스트와 검증을 맡기로
              했어요.
            </p>
          </div>
          <div class="slide-actions show-bottom-nav-only-next">
            <button
              class="slide-nav-btn primary"
              type="button"
              data-target="step-03-structure.html"
            >
              다음
            </button>
          </div>
        </main>
      </div>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
