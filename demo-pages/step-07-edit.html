<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사용자 수정</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="show-bottom-nav">
    <div class="page-shell">
      <div class="phone-frame" aria-label="사용자 수정">
        <header class="status-bar">
          <span class="time">12:22</span>
          <div class="status-icons" aria-label="상태 표시">
            <span class="signal"><i></i><i></i><i></i><i></i></span>
            <span class="wifi" aria-hidden="true"></span>
            <span class="battery" aria-hidden="true"
              ><span class="battery-level"></span
            ></span>
          </div>
        </header>

        <main class="screen">
          <form data-feedback-form class="edit-form">
            <label>담당자<input name="assignee" value="지원" /></label>
            <label>마감일<input name="deadline" value="오늘 밤" /></label>
            <button class="primary-btn large-btn full-width" type="submit">
              수정 사항 반영
            </button>
            <p data-feedback-status role="status"></p>
          </form>
          <div class="slide-actions">
            <button
              class="slide-nav-btn secondary"
              type="button"
              data-target="step-06-detail.html"
            >
              이전
            </button>
            <button
              class="slide-nav-btn primary"
              type="button"
              data-target="step-08-question.html"
            >
              다음
            </button>
          </div>
        </main>
      </div>
    </div>
    <script src="../script.js?v=nav-labels-1"></script>
  </body>
</html>
