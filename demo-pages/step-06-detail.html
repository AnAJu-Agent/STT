<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소주제 상세 카드</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="show-bottom-nav">
    <div class="page-shell">
      <div class="phone-frame" aria-label="소주제 상세 카드">
        <header class="status-bar">
          <span class="time">12:22</span>
          <div class="status-icons" aria-label="상태 표시">
            <span class="signal"><i></i><i></i><i></i><i></i></span>
            <span class="wifi" aria-hidden="true"></span>
            <span class="battery" aria-hidden="true"
              ><span class="battery-level"></span
            ></span>
          </div>
        </header>

        <main class="screen">
          <div class="screen-header">
            <h1 data-hierarchy-title>소주제</h1>
          </div>
          <div class="detail-list">
            <article class="detail-card main" data-detail-topic="해야 할 일">
              <div class="detail-meta">
                <span class="label-pill violet">해야 할 일</span>
                <span data-assignee>담당자: 지원</span>
              </div>
              <h3 data-task-title>발표 자료 초안 작성</h3>
              <p>
                시스템 아키텍처 슬라이드를 수정하고 팀 노션에 업로드합니다. 회의
                원문을 다시 듣고 내용이 누락되지 않도록 세부 사항을 반영합니다.
              </p>
              <div class="detail-footer">
                <span data-deadline>마감: 오늘 밤</span>
                <span class="status-text">진행 중</span>
              </div>
            </article>

            <article class="detail-card" data-detail-topic="확인이 필요한 일">
              <div class="detail-meta">
                <span class="label-pill gray">확인이 필요한 일</span>
                <span>담당자: 서경</span>
              </div>
              <h3>STT 정확도 테스트</h3>
              <p>
                Whisper와 Clova 결과를 비교해 실제 사용 환경에서 정확도를
                점검한다.
              </p>
              <div class="detail-footer">
                <span>마감: 미정</span>
                <span class="status-text muted">검토 필요</span>
              </div>
            </article>
          </div>
          <div class="detail-actions">
            <button
              class="secondary-btn large-btn"
              type="button"
              data-evidence-id="seg_002"
            >
              회의 원문 듣기
            </button>
            <button
              class="primary-btn large-btn"
              type="button"
              data-target="step-07-edit.html"
            >
              수정
            </button>
          </div>
        </main>
      </div>
    </div>
    <script src="../script.js?v=nav-labels-2"></script>
  </body>
</html>
